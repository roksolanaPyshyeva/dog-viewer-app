<div class="app">
  <header class="app__header">
    <h1>Dog Viewer</h1>
  </header>

  <div class="app__body">
    <main class="app__main">
      @if (dogStateService.loading()) {
        <div class="app__loading">
          <span class="app__loading-spinner"></span>
          Loading dogs…
        </div>
      } @else {
        <app-main-image />

        <app-thumbnails />
      }
    </main>

    <app-favorites />
  </div>
</div>
